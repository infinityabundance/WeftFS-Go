name: Publish container

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Image tag"
        required: true
        default: "v0.3.0"

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout WeftFS-Go
        uses: actions/checkout@v4
        with:
          path: WeftFS-Go
      - name: Checkout WeftCodec-Go sibling
        uses: actions/checkout@v4
        with:
          repository: infinityabundance/WeftCodec-Go
          path: WeftCodec-Go
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Resolve version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "value=${{ inputs.version }}" >> "$GITHUB_OUTPUT"
          else
            echo "value=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          fi
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: WeftFS-Go/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/weftfs-go:${{ steps.version.outputs.value }}
            ghcr.io/${{ github.repository_owner }}/weftfs-go:latest
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
